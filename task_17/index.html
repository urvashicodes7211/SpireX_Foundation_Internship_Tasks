<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 Book Library</h1>
        <p>Discover your next favorite book</p>
    </header>
    <section class="container">
        <div class="top-section">
            <input type="text" id="searchInput" placeholder="Search books by title or author...">
            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Technology">Technology</option>
                <option value="Fiction">Fiction</option>
                <option value="Science">Science</option>
                <option value="Self-Help">Self-Help</option>
            </select>
            <button id="addBookBtn">+ Add Book</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h2 id="totalBooks">0</h2>
                <p>Total Books</p>
            </div>
            <div class="stat-card">
                <h2 id="readBooks">0</h2>
                <p>Books Read</p>
            </div>
            <div class="stat-card">
                <h2 id="unreadBooks">0</h2>
                <p>Unread Books</p>
            </div>
        </div>

        <h2 class="section-title">Explore Books</h2>
        <div id="bookList" class="book-list"></div>
        <p id="noBooks" class="no-books">No books found!</p>
    </section>

    <div class="modal" id="bookModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Add New Book</h2>
            <form id="bookForm">
                <input type="text" id="bookTitle" placeholder="Book Title" required>
                <input type="text" id="bookAuthor" placeholder="Author Name" required>
                <select id="bookCategory" required>
                    <option value="">Select Category</option>
                    <option value="Technology">Technology</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Science">Science</option>
                    <option value="Self-Help">Self-Help</option>
                </select>
                <input type="text" id="bookImage" placeholder="Book Image URL (optional)">
                <button type="submit">Add Book</button>
            </form>
        </div>
    </div>
    <footer>
        <p>© 2026 Online Book Library | All Rights Reserved</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
