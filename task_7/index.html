<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
        <p class="subtitle">Convert your money instantly</p>
        <div class="converter">
            <label>Enter Amount</label>
            <input type="number" id="amount" value="1" min="0.01" step="any">
            <div class="currency-box">
                <div class="currency">
                    <label>From</label>
                    <select id="fromCurrency">
                        <option value="USD">USD</option>
                        <option value="INR">INR</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="AUD">AUD</option>
                        <option value="CAD">CAD</option>
                    </select>
                </div>
                <button id="swap" title="Swap Currencies">⇄</button>
                <div class="currency">
                    <label>To</label>
                    <select id="toCurrency">
                        <option value="INR" selected>INR</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="AUD">AUD</option>
                        <option value="CAD">CAD</option>
                    </select>
                </div>
            </div>
            <button id="convertBtn">Convert Currency</button>
            <div class="result">
                <p id="message">Converted Amount</p>
                <h2 id="result">--</h2>
                <p id="rate">Exchange Rate: --</p>
            </div>
        </div>
        <p class="footer">©️ 2026 Currency Converter</p>
    </div>
</body>
</html>
